name: Android release

# Builds a signed APK and attaches it to a GitHub release whenever a version
# tag such as v1.2.0 is pushed. The signing key comes from repository secrets.
# Once the APK is out, the server image for the NAS is built and pushed to
# GitHub's container registry under the same version, and as latest.
on:
  push:
    tags: ['v*']

# Actions are pinned to full commit hashes so a moved tag cannot change what
# runs with the signing key. The comment gives the release each hash is.

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Check the tag matches the version
        # A tag that disagrees with package.json would publish an APK the phones
        # read as some other version, so stop before building anything.
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build:mobile && npx cap sync android
      - name: Decode keystore
        env:
          PMT_KEYSTORE_B64: ${{ secrets.PMT_KEYSTORE_B64 }}
        run: |
          if [ -z "$PMT_KEYSTORE_B64" ]; then echo "PMT_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$PMT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Check the signing key opens
        # Prints only the start of the key file's fingerprint, never the key or
        # password, so a bad secret can be told apart from a damaged key file.
        env:
          PMT_KEYSTORE_PASSWORD: ${{ secrets.PMT_KEYSTORE_PASSWORD }}
        run: |
          echo "key file sha256 starts: $(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-16)"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PMT_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The key file did not open with PMT_KEYSTORE_PASSWORD. Compare the fingerprint above with the PC's key file."
            exit 1
          fi
          echo "Signing key opens."
      - name: Build
        working-directory: android
        env:
          PMT_KEYSTORE: ${{ runner.temp }}/release.jks
          PMT_KEYSTORE_PASSWORD: ${{ secrets.PMT_KEYSTORE_PASSWORD }}
          # Optional. Only needed when the key's password differs from the store's.
          PMT_KEY_PASSWORD: ${{ secrets.PMT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "plex-media-tracker-${GITHUB_REF_NAME#v}.apk"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: plex-media-tracker-*.apk

  image:
    # Only after the APK job has typechecked, tested and released.
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: names
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # The TS-464 has an Intel processor.
          platforms: linux/amd64
          tags: |
            ghcr.io/nugggy/plex-media-tracker:${{ steps.names.outputs.version }}
            ghcr.io/nugggy/plex-media-tracker:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
